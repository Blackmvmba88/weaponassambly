name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: |
          set -o pipefail
          ruff check . --output-format=concise 2>&1 | tee ruff-report.txt

      - name: Ruff suggested diff
        if: steps.ruff.outcome == 'failure'
        run: ruff check . --fix --diff > ruff-fix.diff 2>&1 || true

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report-${{ matrix.python-version }}
          path: |
            ruff-report.txt
            ruff-fix.diff
          if-no-files-found: ignore
          retention-days: 3

      - name: Enforce Ruff result
        if: steps.ruff.outcome == 'failure'
        run: exit 1

      - name: Tests
        run: pytest

      - name: Validate packaged catalogs
        run: bmwa catalog-validate

      - name: Validate example build
        run: bmwa validate configs/bm-s7.example.json
